<title>LEJ Session Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* LEJ Session Board. One column: a section per open session (state, where it stands, questions with options + editable reply + copy), then the to-do list by who acts, with starter prompts on the items a session can build. Terracotta marks what needs the user and every primary action; nothing else is colored. */
:root {
  --bg: #FCFCFB; --surface: #FFFFFF; --fg: #232427; --muted: #6B6C70; --rule: #E3E3DF; --field-border: #85868A;
  --accent: #BD4F2E; --accent-fg: #FFFFFF; --accent-soft: #F7E9E4; --ok: #3F6E4A; --field: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1C1E; --surface: #232427; --fg: #ECEBE8; --muted: #A3A3A6; --rule: #36373B; --field-border: #76777B;
    --accent: #E07556; --accent-fg: #1B1C1E; --accent-soft: #3A2A24; --ok: #8CC49A; --field: #1F2022; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1C1E; --surface: #232427; --fg: #ECEBE8; --muted: #A3A3A6; --rule: #36373B; --field-border: #76777B;
  --accent: #E07556; --accent-fg: #1B1C1E; --accent-soft: #3A2A24; --ok: #8CC49A; --field: #1F2022; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font-body); margin: 0; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 72px; display: grid; gap: 48px; }
header { display: grid; gap: 6px; }
h1 { font: 700 34px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.stamp { color: var(--muted); font-size: 14px; }
.stale { color: var(--accent); font-weight: 600; font-size: 14px; }
code { font-family: var(--font-mono); font-size: 13px; }

.session { display: grid; gap: 16px; padding: 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
.session h2 { font: 600 22px/1.25 var(--font-display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.state { font-size: 14px; font-weight: 600; color: var(--muted); }
.qcount { font: 600 15px/1.3 var(--font-body); color: var(--accent); }
.qtotal { font: 600 17px/1.35 var(--font-body); color: var(--accent); }
.state.needs { color: var(--accent); }
.state.done { color: var(--ok); }
.where { margin: 0; padding-left: 18px; display: grid; gap: 5px; max-width: 72ch; }
.reminders { display: grid; gap: 6px; max-width: 72ch; }
.action { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--accent); border-radius: 8px; max-width: 72ch; }
.action h3 { margin: 0; font: 600 16px var(--font-body); }
.action ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.action pre { margin: 0; padding: 10px 12px; background: var(--field); border: 1px solid var(--rule); border-radius: 6px; font: 13px var(--font-mono); white-space: pre-wrap; word-break: break-word; }
.action a { color: var(--accent); }
.backlog { max-width: 72ch; }
.backlog summary { cursor: pointer; font-weight: 600; }
.backlog ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; }
.reminders h3 { margin: 0; font: 600 15px var(--font-body); }
.reminders ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.reminders .when { color: var(--muted); }

.overview { display: grid; gap: 10px; max-width: 72ch; font-size: 16.5px; }
.overview p { margin: 0; }
details.session { display: block; padding: 0; margin: 0; }
details.session > summary { list-style: none; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 4px; padding: 18px 22px; cursor: pointer; color: var(--fg); width: auto; font: inherit; }
details.session > summary::-webkit-details-marker { display: none; }
details.session > summary::before { content: "\25B8"; color: var(--muted); grid-row: 1 / span 2; font-size: 15px; line-height: 1.9; }
details.session[open] > summary::before { content: "\25BE"; }
details.session > summary h2, details.session > summary .need { grid-column: 2; }
.need { font-size: 15px; font-weight: 600; color: var(--muted); }
.need.ask { color: var(--accent); }
.session-body { display: grid; gap: 16px; padding: 0 22px 22px; min-width: 0; }

.q { display: grid; gap: 10px; min-width: 0; padding-top: 16px; border-top: 1px solid var(--rule); }
.q-title { margin: 0; font: 600 17px/1.35 var(--font-display); }
.q-note { color: var(--muted); font-size: 14.5px; max-width: 72ch; }
.opts { display: grid; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.opts label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; font-size: 15px; }
.opts input { margin-top: 5px; accent-color: var(--accent); }
.rec { color: var(--accent); font-weight: 600; font-size: 13px; margin-left: 6px; }
textarea { width: 100%; min-height: 76px; resize: vertical; font: 13.5px/1.55 var(--font-mono); color: var(--fg); background: var(--field); border: 1px solid var(--field-border); border-radius: 6px; padding: 10px 12px; }
textarea.prompt { min-height: 260px; }
a:focus-visible, textarea:focus-visible, button:focus-visible, .opts input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.to { font-size: 13.5px; color: var(--muted); }
.copy { font: 600 14px var(--font-body); color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.copy.was { background: transparent; color: var(--ok); box-shadow: inset 0 0 0 1px var(--rule); }
.copy-all { padding-top: 16px; border-top: 1px solid var(--rule); }
.copy-all .to { font-weight: 600; color: var(--fg); }

.todo { display: grid; gap: 32px; }
.todo > h2 { font: 700 26px/1.2 var(--font-display); letter-spacing: -0.01em; margin: 0; }
.todo-intro { color: var(--muted); font-size: 14.5px; margin: -20px 0 0; max-width: 72ch; }
.group { display: grid; gap: 10px; }
.group h3 { font: 600 19px/1.3 var(--font-display); margin: 0; }
details.group { display: block; margin: 0; }
details.group > summary.group-head { list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; color: var(--fg); width: auto; font: inherit; padding: 6px 0; }
details.group > summary.group-head::-webkit-details-marker { display: none; }
details.group > summary.group-head::before { content: "\25B8"; color: var(--muted); font-size: 15px; }
details.group[open] > summary.group-head::before { content: "\25BE"; }
.group-count { color: var(--muted); font-size: 14.5px; }
details.group[open] > .items { margin-top: 10px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; }
.items > li { padding: 10px 0; border-bottom: 1px solid var(--rule); max-width: 80ch; }
.items > li:first-child { border-top: 1px solid var(--rule); }
.items b { font-weight: 600; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14.5px; width: fit-content; }
summary .done-mark { color: var(--ok); margin-left: 8px; font-weight: 500; }
.starter { display: grid; gap: 10px; margin-top: 10px; }
.starter-title { font: 600 16px var(--font-mono); }
.refresh-control { width: fit-content; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--field-border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
</style>

<main class="wrap">
  <header>
    <h1>LEJ Session Board</h1>
    <div class="qtotal" id="qtotal" hidden></div>
    <div class="stamp" id="stamp"></div>
    <div class="stale" id="stale" hidden></div>
    <div id="copy-status" class="sr-only" role="status" aria-atomic="true"></div>
  </header>
  <section class="overview" id="overview" aria-label="Overview"></section>
  <div id="sessions" style="display:grid;gap:24px"></div>
  <section class="todo" aria-labelledby="t-head">
    <h2 id="t-head">To-do list</h2>
    <p class="todo-intro" id="todo-intro"></p>
    <div id="groups" style="display:grid;gap:32px"></div>
  </section>
</main>

<script>
(function () {
  var data = JSON.parse(document.getElementById('board-data').textContent);
  // All persistent UI state belongs to one board, even when several boards share
  // an HTTP origin. Keep identity stable across rebuilds; never import ambiguous
  // unscoped keys from older versions. Explicit ids also allow project moves.
  var identity = data.boardId ? ['id', data.boardId] : data.projectFolder ? ['project', data.projectFolder] : ['page', location.pathname];
  var storagePrefix = 'lej-board:' + JSON.stringify(identity) + ':';
  function load(k) { try { return localStorage.getItem(storagePrefix + k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(storagePrefix + k, v); } catch (e) {} }
  // Most board content is plain text: avoid escaping it and invoking the HTML
  // parser for every label. Only formattedItem parses the documented rich prose.
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (arguments.length > 2) n.textContent = String(text); return n; }

  // Board prose supports only the documented <b>/<code> formatting. Parse in an
  // inert template, then copy text and those elements without any attributes.
  function formattedItem(value) {
    var item = el('li'), source = document.createElement('template');
    source.innerHTML = String(value == null ? '' : value);
    function append(parent, nodes) {
      Array.prototype.forEach.call(nodes, function (node) {
        if (node.nodeType === 3) parent.appendChild(document.createTextNode(node.textContent));
        else if (node.nodeType === 1) {
          if (node.namespaceURI === 'http://www.w3.org/1999/xhtml' && (node.tagName === 'B' || node.tagName === 'CODE')) {
            var safe = el(node.tagName.toLowerCase());
            append(safe, node.childNodes); parent.appendChild(safe);
          } else parent.appendChild(document.createTextNode(node.textContent));
        }
      });
    }
    append(item, source.content.childNodes);
    return item;
  }

  function actionLink(action) {
    var text = String(action.linkText || action.link), href;
    try {
      var url = new URL(action.link);
      if (url.protocol === 'https:' || url.protocol === 'http:') href = url.href;
    } catch (e) {}
    var link = el(href ? 'a' : 'span'); link.textContent = text;
    if (href) { link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer'; }
    return link;
  }

  function announceCopy(btn, message) {
    document.getElementById('copy-status').textContent = btn.copyLabel + ': ' + message;
  }
  function markCopied(btn) {
    btn.textContent = '✓ Copied'; btn.classList.add('was');
    btn.setAttribute('aria-label', btn.copyLabel.replace(/^Copy /, 'Copied '));
  }
  function resetCopy(btn, key, label) {
    btn.textContent = label || 'Copy'; btn.classList.remove('was'); btn.setAttribute('aria-label', btn.copyLabel);
    // An earlier clipboard promise must not mark newly edited text as copied.
    btn.copyVersion = (btn.copyVersion || 0) + 1;
    save('copied:' + key, '');
  }
  function copyText(text, btn, key, onDone) {
    var version = btn.copyVersion || 0;
    function current() { return version === (btn.copyVersion || 0); }
    function mark() {
      if (!current()) return;
      markCopied(btn); save('copied:' + key, receipt(text)); announceCopy(btn, 'copied to clipboard.'); if (onDone) onDone();
    }
    function fallback() {
      if (!current()) return;
      var previous = document.activeElement;
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      if (previous && previous.isConnected) previous.focus({ preventScroll: true });
      if (ok) mark(); else { btn.textContent = 'Select the text and copy'; btn.setAttribute('aria-label', 'Select the text and copy: ' + btn.copyLabel); announceCopy(btn, 'Select the text and copy it manually.'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(mark, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  // A receipt describes the copied payload, not just a key. Another tab can
  // finish an old copy after a newer draft has been saved under the same id.
  function receipt(text) { return JSON.stringify([1, text]); }
  function copyButton(key, label, payload) {
    var b = el('button', 'copy', 'Copy'); b.type = 'button'; b.copyLabel = label; b.setAttribute('aria-label', label);
    b.copyPayload = payload;
    if (load('copied:' + key) === receipt(payload())) markCopied(b);
    return b;
  }

  // Question counts up top, so nobody answers one question and misses the rest below it.
  function nQ(n) { return n + (n === 1 ? ' question needs' : ' questions need') + ' you'; }
  var asking = data.sessions.filter(function (s) { return (s.questions || []).length; });
  var total = asking.reduce(function (n, s) { return n + s.questions.length; }, 0);
  if (total) { var qt = document.getElementById('qtotal'); qt.hidden = false; qt.textContent = nQ(total) + ' across ' + asking.length + (asking.length === 1 ? ' session' : ' sessions'); }
  document.getElementById('stamp').textContent = 'Updated ' + data.updated + ' · kept by the ' + data.manager + ' session';

  // A board nobody has checked in 30 minutes says so, so the user knows not to trust it.
  var checked = Date.parse(data.updatedISO || '');
  function staleness() {
    var box = document.getElementById('stale'), mins = Math.round((Date.now() - checked) / 60000);
    if (isNaN(checked) || mins < 30) { box.hidden = true; return; }
    box.textContent = 'Out of date: the ' + data.manager + ' last checked the sessions ' + (mins < 120 ? mins + ' minutes' : Math.round(mins / 60) + ' hours') + ' ago. Ask it to refresh.';
    box.hidden = false;
  }
  staleness(); setInterval(staleness, 60000);

  // Every answer pasted into a session ends with a reminder to report back, so the board hears about it.
  // Answers addressed to the manager itself don't need it.
  var reportBack = data.reportBack || ('When you\'ve acted on this, send the ' + data.manager + ' session a one-line update with SendMessage: what you did and what\'s next.');
  function withReport(header, text) { return header === data.manager ? text : text + '\n\n' + reportBack; }
  document.getElementById('todo-intro').textContent = data.todoIntro;

  // One question: its options (the recommended one picked by default), a "Write your own answer" option, an editable
  // reply and Copy. Copy puts the header line (the session's name, or the manager's for to-do questions), then
  // "Re: <title>", then the reply.
  function questionBlock(q, header) {
    var box = el('div', 'q');
    var title = el('h3', 'q-title', q.title); title.id = 'question-' + q.id; box.appendChild(title);
    if (q.note) { var note = el('div', 'q-note', q.note); note.id = 'note-' + q.id; box.appendChild(note); }
    var fs = el('fieldset', 'opts'); fs.setAttribute('aria-labelledby', title.id);
    if (q.note) fs.setAttribute('aria-describedby', note.id);
    var ta = el('textarea'); ta.setAttribute('aria-label', 'Reply to: ' + q.title); ta.id = 'reply-' + q.id;
    if (q.note) ta.setAttribute('aria-describedby', note.id);
    var opts = q.options.concat([{ label: 'Write your own answer', text: '', own: true }]);
    var radios = [];
    opts.forEach(function (o, i) {
      var lab = el('label'); var r = el('input'); r.type = 'radio'; r.name = 'opt-' + q.id; r.id = 'opt-' + q.id + '-' + i;
      lab.appendChild(r);
      var labelText = el('span', null, o.label);
      if (o.rec) labelText.appendChild(el('span', 'rec', 'Recommended'));
      lab.appendChild(labelText);
      r.addEventListener('change', function () {
        ta.value = o.own ? (load('own:' + q.id) || '') : o.text;
        ta.placeholder = o.own ? 'Write your own answer' : '';
        save('pick:' + q.id, String(i)); save('text:' + q.id, ta.value);
        resetCopy(btn, 'q:' + q.id);
      });
      radios.push(r); fs.appendChild(lab);
    });
    var pick = load('pick:' + q.id); var idx = pick !== null && opts[+pick] ? +pick : Math.max(0, q.options.findIndex(function (o) { return o.rec; }));
    radios[idx].checked = true;
    if (opts[idx].own) ta.placeholder = 'Write your own answer';
    var savedText = load('text:' + q.id); ta.value = savedText !== null ? savedText : opts[idx].text;
    ta.addEventListener('input', function () {
      save('text:' + q.id, ta.value);
      if (radios[radios.length - 1].checked) save('own:' + q.id, ta.value);
      resetCopy(btn, 'q:' + q.id);
    });
    box.appendChild(fs); box.appendChild(ta);
    var act = el('div', 'actions'); act.appendChild(el('span', 'to', 'Paste into ' + q.to));
    function payload() { return withReport(header, header + '\nRe: ' + q.title + '\n' + ta.value.trim()); }
    var btn = copyButton('q:' + q.id, 'Copy reply to ' + q.title + ' for ' + header, payload);
    btn.addEventListener('click', function () { copyText(payload(), btn, 'q:' + q.id); });
    act.appendChild(btn); box.appendChild(act);
    return { box: box, q: q, ta: ta, btn: btn };
  }

  // The manager's overview: one or two short paragraphs on what's happening now and what already happened.
  var ov = document.getElementById('overview');
  String(data.overview || '').split(/\n\s*\n/).forEach(function (p) { if (p.trim()) ov.appendChild(el('p', null, p.trim())); });
  if (!ov.children.length) ov.hidden = true;

  // Urgent sessions first, then sessions with questions, then the rest. Each starts collapsed to its title and what's
  // needed from the user, and remembers being opened, so the local page's auto-reload doesn't close it.
  function rank(s) { return s.urgent ? 0 : ((s.questions || []).length || (s.pastes || []).length || (s.actions || []).length || s.tone === 'needs') ? 1 : 2; }
  var host = document.getElementById('sessions');
  data.sessions
    .filter(function (s) { return !s.isManager || (s.questions || []).length || (s.pastes || []).length || (s.reminders || []).length || (s.actions || []).length; })
    .map(function (s, i) { return { s: s, i: i }; })
    .sort(function (a, b) { return rank(a.s) - rank(b.s) || a.i - b.i; })
    .forEach(function (x) {
    var s = x.s;
    var sec = el('details', 'session'); sec.id = 's-' + s.id;
    if (load('open:' + s.id) === '1') sec.open = true;
    sec.addEventListener('toggle', function () { save('open:' + s.id, sec.open ? '1' : '0'); });
    var sum = el('summary');
    sum.appendChild(el('h2', null, s.name));
    var nqs = (s.questions || []).length;
    var need = s.need || (nqs ? nQ(nqs) : 'Nothing needed from you');
    sum.appendChild(el('div', 'need' + (s.urgent || nqs || (s.pastes || []).length || (s.actions || []).length || s.tone === 'needs' ? ' ask' : ''), (s.urgent ? 'Urgent: ' : '') + need));
    sec.appendChild(sum);
    var body = el('div', 'session-body');
    var nq = (s.questions || []).length;
    if (nq) body.appendChild(el('div', 'qcount', nQ(nq) + ' in this section' + (nq > 1 ? ' (answer all ' + nq + ', or use Copy all answers at the bottom)' : '')));
    body.appendChild(el('div', 'state' + (s.tone ? ' ' + s.tone : ''), s.state));
    if (s.where && s.where.length) {
      var ul = el('ul', 'where'); s.where.forEach(function (w) { ul.appendChild(el('li', null, w)); }); body.appendChild(ul);
    }
    // Actions: things only the user can do (a key, a click, a setting). Everything needed to do it sits here:
    // the link, the steps, any text to paste, and a Copy that tells the manager it's done.
    (s.actions || []).forEach(function (a) {
      var box = el('div', 'action'); box.appendChild(el('h3', null, a.title));
      if (a.why) box.appendChild(el('div', 'q-note', a.why));
      if (a.link) { var linkBox = el('div'); linkBox.appendChild(actionLink(a)); box.appendChild(linkBox); }
      if ((a.steps || []).length) { var ol = el('ol'); a.steps.forEach(function (st) { ol.appendChild(el('li', null, st)); }); box.appendChild(ol); }
      if (a.text) {
        box.appendChild(el('pre', null, a.text));
        var ca = el('div', 'actions'); ca.appendChild(el('span', 'to', a.textTo || 'Copy this'));
        var cb = copyButton('act-text:' + a.id, 'Copy text for ' + a.title + ' in ' + s.name, function () { return a.text; }); cb.addEventListener('click', function () { copyText(a.text, cb, 'act-text:' + a.id); }); ca.appendChild(cb); box.appendChild(ca);
      }
      var da = el('div', 'actions'); da.appendChild(el('span', 'to', 'When it\'s done, paste into ' + data.manager));
      var db = copyButton('act-done:' + a.id, 'Copy "done" confirmation for ' + a.title + ' to ' + data.manager, function () { return data.manager + '\nDone: ' + a.title; }); db.textContent = db.classList.contains('was') ? '✓ Copied' : 'Copy "done"';
      db.addEventListener('click', function () { copyText(data.manager + '\nDone: ' + a.title, db, 'act-done:' + a.id); }); da.appendChild(db); box.appendChild(da);
      body.appendChild(box);
    });
    // Backlog: this workstream's open to-do items, kept in its own section so nothing about it lives elsewhere.
    if ((s.backlog || []).length) {
      var bl = el('details', 'backlog'); bl.appendChild(el('summary', null, 'Backlog (' + s.backlog.length + ')'));
      var bu = el('ul'); s.backlog.forEach(function (b) { bu.appendChild(formattedItem(b)); }); bl.appendChild(bu); body.appendChild(bl);
    }
    // Reminders: things the user asked to be reminded of. Not questions, so no options and no copy.
    if ((s.reminders || []).length) {
      var rem = el('div', 'reminders'); rem.appendChild(el('h3', null, 'Reminders'));
      var rl = el('ul'); s.reminders.forEach(function (r) {
        var li = el('li', null, r.text);
        if (r.when) { li.appendChild(document.createTextNode(' ')); li.appendChild(el('span', 'when', '· ' + r.when)); }
        rl.appendChild(li);
      });
      rem.appendChild(rl); body.appendChild(rem);
    }
    var answers = [];
    (s.questions || []).forEach(function (q) {
      var a = questionBlock(q, s.name); answers.push(a); body.appendChild(a.box);
    });
    if (answers.length > 1) {
      // One paste answers every question in the section: the session name once, then a Re: part per question.
      var allKey = 'all:' + answers.map(function (a) { return a.q.id; }).join('+');
      var allAct = el('div', 'actions copy-all');
      allAct.appendChild(el('span', 'to', 'All ' + answers.length + ' answers in one paste'));
      function allPayload() {
        return withReport(s.name, s.name + '\n\n' + answers.map(function (a) { return 'Re: ' + a.q.title + '\n' + a.ta.value.trim(); }).join('\n\n'));
      }
      var allBtn = copyButton(allKey, 'Copy all answers for ' + s.name, allPayload); allBtn.textContent = allBtn.classList.contains('was') ? '✓ Copied' : 'Copy all answers';
      answers.forEach(function (a) {
        function changed() { resetCopy(allBtn, allKey, 'Copy all answers'); }
        a.box.addEventListener('input', changed, true);
        a.box.addEventListener('change', changed, true);
      });
      allBtn.addEventListener('click', function () {
        copyText(allPayload(), allBtn, allKey, function () {
          answers.forEach(function (a) { markCopied(a.btn); save('copied:q:' + a.q.id, receipt(a.btn.copyPayload())); });
        });
      });
      allAct.appendChild(allBtn); body.appendChild(allAct);
    }
    (s.pastes || []).forEach(function (pp) {
      var box = el('div', 'q');
      box.appendChild(el('h3', 'q-title', pp.title));
      if (pp.note) box.appendChild(el('div', 'q-note', pp.note));
      var key = 'paste:' + pp.id;
      var ta = el('textarea', 'prompt'); ta.id = 'paste-' + pp.id; ta.setAttribute('aria-label', pp.title);
      var saved = load('text:' + key); ta.value = saved !== null ? saved : pp.text;
      ta.addEventListener('input', function () { save('text:' + key, ta.value); resetCopy(btn, key); });
      box.appendChild(ta);
      var act = el('div', 'actions'); act.appendChild(el('span', 'to', 'Paste into ' + pp.to));
      var btn = copyButton(key, 'Copy handoff ' + pp.title + ' to ' + pp.to, function () { return ta.value.trim(); });
      btn.addEventListener('click', function () { copyText(ta.value.trim(), btn, key); });
      act.appendChild(btn); box.appendChild(act); body.appendChild(box);
    });
    sec.appendChild(body);
    host.appendChild(sec);
  });

  var gh = document.getElementById('groups');
  data.groups.forEach(function (g) {
    // Each group starts collapsed to its title and item count, and remembers being opened.
    var gkey = 'open:group:' + g.title;
    var grp = el('details', 'group'); if (load(gkey) === '1') grp.open = true;
    grp.addEventListener('toggle', function () { save(gkey, grp.open ? '1' : '0'); });
    var gsum = el('summary', 'group-head'); gsum.appendChild(el('h3', null, g.title));
    var nStart = g.items.filter(function (it) { return it.starter; }).length;
    gsum.appendChild(el('span', 'group-count', g.items.length + (g.items.length === 1 ? ' item' : ' items') + (nStart ? ' · ' + nStart + (nStart === 1 ? ' starter prompt' : ' starter prompts') : '')));
    grp.appendChild(gsum);
    var ul = el('ul', 'items');
    g.items.forEach(function (it) {
      var li = formattedItem(it.text);
      if (it.question) li.appendChild(questionBlock(it.question, data.manager).box);
      if (it.starter) {
        var st = it.starter; var key = 'starter:' + st.title.split(' ')[0];
        var det = el('details'); var sum = el('summary', null, st.title);
        var doneMark = el('span', 'done-mark', '');
        sum.appendChild(doneMark); det.appendChild(sum);
        var wrap = el('div', 'starter');
        wrap.appendChild(el('div', 'starter-title', st.title));
        var ta = el('textarea', 'prompt'); ta.id = 'prompt-' + key.replace(':', '-'); ta.setAttribute('aria-label', 'Starter prompt ' + st.title);
        var saved = load('text:' + key); ta.value = saved !== null ? saved : st.prompt;
        ta.addEventListener('input', function () {
          save('text:' + key, ta.value); resetCopy(btn, key); doneMark.textContent = '';
        });
        wrap.appendChild(ta);
        var act = el('div', 'actions'); act.appendChild(el('span', 'to', 'Paste into a new session in ' + data.projectFolder + ', named ' + st.title));
        function payload() { return st.title + '\n\n' + ta.value.trim(); }
        var btn = copyButton(key, 'Copy starter prompt ' + st.title, payload);
        if (btn.classList.contains('was')) doneMark.textContent = '✓ copied';
        btn.addEventListener('click', function () { copyText(payload(), btn, key, function () { doneMark.textContent = '✓ copied'; }); });
        act.appendChild(btn); wrap.appendChild(act); det.appendChild(wrap); li.appendChild(det);
      }
      ul.appendChild(li);
    });
    grp.appendChild(ul); gh.appendChild(grp);
  });
})();
</script>
